name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  security-events: write

env:
  #IMAGE_TAG: 2026
  IMAGE_TAG: ${{ github.sha }}
  #RELEASE_TAG: v0.1.0

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kippytech
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Build API Gateway image
      #   run: |
      #     docker build \
      #       --target production \
      #       -t ghcr.io/kippytech/api-gateway:${{ env.IMAGE_TAG }} \
      #       ./api-gateway

      - name: Build and push API Gateway image
        id: build-api-gateway
        uses: docker/build-push-action@v7
        with:
          context: ./api-gateway
          target: production
          push: true
          tags: ghcr.io/kippytech/api-gateway:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true

      - name: Scan API Gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/kippytech/api-gateway:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-api-gateway.sarif
          exit-code: '1'
          ignore-unfixed: true          
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          limit-severities-for-sarif: true

      - name: Upload API Gateway scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api-gateway.sarif
          category: trivy-api-gateway

      - name: Attest API Gateway image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/kippytech/api-gateway
          subject-digest: ${{ steps.build-api-gateway.outputs.digest }}
          push-to-registry: true

      # - name: Build Identity Service image
      #   run: |
      #     docker build \
      #       --target production \
      #       -t ghcr.io/kippytech/identity-service:${{ env.IMAGE_TAG }} \
      #       ./identity-service

      - name: Build and push Identity Service image
        id: build-identity-service
        uses: docker/build-push-action@v7
        with:
          context: ./identity-service
          target: production
          push: true
          tags: ghcr.io/kippytech/identity-service:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true

      - name: Scan Identity Service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/kippytech/identity-service:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-identity-service.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          limit-severities-for-sarif: true

      - name: Upload Identity Service scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-identity-service.sarif
          category: trivy-identity-service

      - name: Attest Identity Service image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/kippytech/identity-service
          subject-digest: ${{ steps.build-identity-service.outputs.digest }}
          push-to-registry: true

      # - name: Build Post Service image
      #   run: |
      #     docker build \
      #       --target production \
      #       -t ghcr.io/kippytech/post-service:${{ env.IMAGE_TAG }} \
      #       ./post-service

      - name: Build and push Post Service image
        id: build-post-service
        uses: docker/build-push-action@v7
        with:
          context: ./post-service
          target: production
          push: true
          tags: ghcr.io/kippytech/post-service:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true

      - name: Scan Post Service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/kippytech/post-service:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-post-service.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          limit-severities-for-sarif: true

      - name: Upload Post Service scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-post-service.sarif
          category: trivy-post-service

      - name: Attest Post Service image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/kippytech/post-service
          subject-digest: ${{ steps.build-post-service.outputs.digest }}
          push-to-registry: true

      # - name: Build Media Service image
      #   run: |
      #     docker build \
      #       --target production \
      #       -t ghcr.io/kippytech/media-service:${{ env.IMAGE_TAG }} \
      #       ./media-service

      - name: Build and push Media Service image
        id: build-media-service
        uses: docker/build-push-action@v7
        with:
          context: ./media-service
          target: production
          push: true
          tags: ghcr.io/kippytech/media-service:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true

      - name: Scan Media Service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/kippytech/media-service:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-media-service.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          limit-severities-for-sarif: true

      - name: Upload Media Service scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-media-service.sarif
          category: trivy-media-service

      - name: Attest Media Service image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/kippytech/media-service
          subject-digest: ${{ steps.build-media-service.outputs.digest }}
          push-to-registry: true

      # - name: Build Search Service image
      #   run: |
      #     docker build \
      #       --target production \
      #       -t ghcr.io/kippytech/search-service:${{ env.IMAGE_TAG }} \
      #       ./search-service

      - name: Build and push Search Service image
        id: build-search-service
        uses: docker/build-push-action@v7
        with:
          context: ./search-service
          target: production
          push: true
          tags: ghcr.io/kippytech/search-service:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true

      - name: Scan Search Service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/kippytech/search-service:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-search-service.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          limit-severities-for-sarif: true

      - name: Upload Search Service scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-search-service.sarif
          category: trivy-search-service

      - name: Attest Search Service image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/kippytech/search-service
          subject-digest: ${{ steps.build-search-service.outputs.digest }}
          push-to-registry: true

      # - name: Push API Gateway image
      #   run: docker push ghcr.io/kippytech/api-gateway:${{ env.IMAGE_TAG }}

      # - name: Push Identity Service image
      #   run: docker push ghcr.io/kippytech/identity-service:${{ env.IMAGE_TAG }}

      # - name: Push Post Service image
      #   run: docker push ghcr.io/kippytech/post-service:${{ env.IMAGE_TAG }}

      # - name: Push Media Service image
      #   run: docker push ghcr.io/kippytech/media-service:${{ env.IMAGE_TAG }}

      # - name: Push Search Service image
      #   run: docker push ghcr.io/kippytech/search-service:${{ env.IMAGE_TAG }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} IMAGE_TAG=${{ github.sha }} << 'EOF'
            cd /path/to/nodejs-microservices-2025

            PREVIOUS_TAG=$(grep '^IMAGE_TAG=' .env | cut -d= -f2-)

            echo "Previous version: $PREVIOUS_TAG"
            echo "New version: $IMAGE_TAG"

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d

            echo "Waiting for application..."

            if ! timeout 120 bash -c '
              until curl -fs http://127.0.0.1:3000/api/health; do
                sleep 2
              done
            '; then

              echo "Health check failed. Rolling back..."

              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env

              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                pull

              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                up -d

              exit 1
            fi

            echo "Health check passed."

            echo "Running smoke test..."

            if ! curl --fail-with-body \
              -X POST \
              http://127.0.0.1:3000/v1/auth/register \
              -H "Content-Type: application/json" \
              -d "{
                \"username\": \"deploy-smoke-${IMAGE_TAG:0:8}\",
                \"email\": \"deploy-${IMAGE_TAG:0:8}@example.com\",
                \"password\": \"SmokeTest123!\"
              }"
            then

              echo "Smoke test failed. Rolling back..."

              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env

              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                pull

              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                up -d

              exit 1
            fi

            echo "Deployment successful."

            docker image prune -f
          EOF

        # use the steps below to run the deploy.sh script instead of inline commands

      # - name: Deploy to VPS
      #   run: |
      #     ssh \
      #       ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
      #       "/path/to/nodejs-microservices-2025 && ./deploy.sh '${{ github.sha }}'"

