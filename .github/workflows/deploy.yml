name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  #IMAGE_TAG: 2026
  IMAGE_TAG: ${{ github.sha }}
  #RELEASE_TAG: v0.1.0

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kippytech
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway image
        run: |
          docker build \
            --target production \
            -t ghcr.io/kippytech/api-gateway:${{ env.IMAGE_TAG }} \
            ./api-gateway

      # - name: Tag API Gateway Release
      #   run: |
      #     docker tag \
      #       ghcr.io/kippytech/api-gateway:${{ env.IMAGE_TAG }} \
      #       ghcr.io/kippytech/api-gateway:${{ env.RELEASE_TAG }}

      - name: Build Identity Service image
        run: |
          docker build \
            --target production \
            -t ghcr.io/kippytech/identity-service:${{ env.IMAGE_TAG }} \
            ./identity-service

      # - name: Tag Identity Service Release
      #   run: |
      #     docker tag \
      #       ghcr.io/kippytech/identity-service:${{ env.IMAGE_TAG }} \
      #       ghcr.io/kippytech/identity-service:${{ env.RELEASE_TAG }}

      - name: Build Post Service image
        run: |
          docker build \
            --target production \
            -t ghcr.io/kippytech/post-service:${{ env.IMAGE_TAG }} \
            ./post-service

      # - name: Tag Post Service Release
      #   run: |
      #     docker tag \
      #       ghcr.io/kippytech/post-service:${{ env.IMAGE_TAG }} \
      #       ghcr.io/kippytech/post-service:${{ env.RELEASE_TAG }}

      - name: Build Media Service image
        run: |
          docker build \
            --target production \
            -t ghcr.io/kippytech/media-service:${{ env.IMAGE_TAG }} \
            ./media-service

      # - name: Tag Media Service Release
      #   run: |
      #     docker tag \
      #       ghcr.io/kippytech/media-service:${{ env.IMAGE_TAG }} \
      #       ghcr.io/kippytech/media-service:${{ env.RELEASE_TAG }}

      - name: Build Search Service image
        run: |
          docker build \
            --target production \
            -t ghcr.io/kippytech/search-service:${{ env.IMAGE_TAG }} \
            ./search-service

      # - name: Tag Search Service Release
      #   run: |
      #     docker tag \
      #       ghcr.io/kippytech/search-service:${{ env.IMAGE_TAG }} \
      #       ghcr.io/kippytech/search-service:${{ env.RELEASE_TAG }}

      - name: Push API Gateway image
        run: docker push ghcr.io/kippytech/api-gateway:${{ env.IMAGE_TAG }}

      # - name: Push Release Image
      #   run: |
      #     docker push ghcr.io/kippytech/api-gateway:${{ env.RELEASE_TAG }}

      - name: Push Identity Service image
        run: docker push ghcr.io/kippytech/identity-service:${{ env.IMAGE_TAG }}

      # - name: Push Release Image
      #   run: |
      #     docker push ghcr.io/kippytech/identity-service:${{ env.RELEASE_TAG }}

      - name: Push Post Service image
        run: docker push ghcr.io/kippytech/post-service:${{ env.IMAGE_TAG }}

      # - name: Push Release Image
      #   run: |
      #     docker push ghcr.io/kippytech/post-service:${{ env.RELEASE_TAG }}

      - name: Push Media Service image
        run: docker push ghcr.io/kippytech/media-service:${{ env.IMAGE_TAG }}

      # - name: Push Release Image
      #   run: |
      #     docker push ghcr.io/kippytech/media-service:${{ env.RELEASE_TAG }}

      - name: Push Search Service image
        run: docker push ghcr.io/kippytech/search-service:${{ env.IMAGE_TAG }}

      # - name: Push Release Image
      #   run: |
      #     docker push ghcr.io/kippytech/search-service:${{ env.RELEASE_TAG }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} IMAGE_TAG=${{ github.sha }} << 'EOF'
            cd /path/to/nodejs-microservices-2025

            PREVIOUS_TAG=$(grep '^IMAGE_TAG=' .env | cut -d= -f2-)

            echo "Previous version: $PREVIOUS_TAG"
            echo "New version: $IMAGE_TAG"

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d

            echo "Waiting for application..."

            if ! timeout 120 bash -c '
              until curl -fs http://127.0.0.1:3000/api/health; do
                sleep 2
              done
            '; then

              echo "Health check failed. Rolling back..."

              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env

              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                pull

              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                up -d

              exit 1
            fi

            echo "Health check passed."

            echo "Running smoke test..."

            if ! curl --fail-with-body \
              -X POST \
              http://127.0.0.1:3000/v1/auth/register \
              -H "Content-Type: application/json" \
              -d "{
                \"username\": \"deploy-smoke-${IMAGE_TAG:0:8}\",
                \"email\": \"deploy-${IMAGE_TAG:0:8}@example.com\",
                \"password\": \"SmokeTest123!\"
              }"
            then

              echo "Smoke test failed. Rolling back..."

              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env

              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                pull

              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                up -d

              exit 1
            fi

            echo "Deployment successful."

            docker image prune -f
          EOF

        # use the steps below to run the deploy.sh script instead of inline commands

      # - name: Deploy to VPS
      #   run: |
      #     ssh \
      #       ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
      #       "/path/to/nodejs-microservices-2025 && ./deploy.sh '${{ github.sha }}'"

