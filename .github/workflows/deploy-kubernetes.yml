name: Deploy to Kubernetes (GitOps)

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - identity-service
          - post-service
          - media-service
          - search-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kippytech
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build \
            --target production \
            -t ghcr.io/kippytech/${{ matrix.service }}:${{ env.IMAGE_TAG }} \
            ./${{ matrix.service }}

      - name: Push image
        run: |
          docker push ghcr.io/kippytech/${{ matrix.service }}:${{ env.IMAGE_TAG }}

  update-helm:
    needs: build-and-push

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm image tag
        run: |
          # Older version (requires exactly two leading spaces)
          # sed -i "s/^  tag:.*/  tag: ${IMAGE_TAG}/" helm/nodejs-microservices/values.yaml

          # Preferred version (works regardless of indentation)
          sed -Ei "s/^([[:space:]]*tag:).*/\1 ${IMAGE_TAG}/" helm/nodejs-microservices/values-dev.yaml

      - name: Commit updated Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/nodejs-microservices/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update image tag to ${IMAGE_TAG} [skip ci]"

          git push