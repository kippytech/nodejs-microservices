name: Deploy to Kubernetes (GitOps)

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  #IMAGE_TAG: ${{ github.sha }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  detect-changes:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'

    runs-on: ubuntu-latest

    outputs:
      application_changed: ${{ steps.changes.outputs.application_changed }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detect application changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- \
            api-gateway/ \
            identity-service/ \
            post-service/ \
            media-service/ \
            search-service/ \
            helm/nodejs-microservices/templates/ \
            helm/nodejs-microservices/Chart.yaml \
            helm/nodejs-microservices/values.yaml; then

            echo "application_changed=false" >> "$GITHUB_OUTPUT"

            echo "No application changes detected."
            echo "This is likely a GitOps/environment-only change."
          else

            echo "application_changed=true" >> "$GITHUB_OUTPUT"

            echo "Application changes detected."
          fi

  build-and-push:
    needs: detect-changes

    if: needs.detect-changes.outputs.application_changed == 'true'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - identity-service
          - post-service
          - media-service
          - search-service

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kippytech
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build \
            --target production \
            -t ghcr.io/kippytech/${{ matrix.service }}:${{ env.IMAGE_TAG }} \
            ./${{ matrix.service }}

      - name: Push image
        run: |
          docker push ghcr.io/kippytech/${{ matrix.service }}:${{ env.IMAGE_TAG }}

  update-helm:
    needs:
      - detect-changes
      - build-and-push

    if: needs.detect-changes.outputs.application_changed == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update development image tag
        run: |
          # Older version (requires exactly two leading spaces)
          # sed -i "s/^  tag:.*/  tag: ${IMAGE_TAG}/" helm/nodejs-microservices/values-dev.yaml

          # Preferred version (works regardless of indentation)
          sed -Ei \
            "s/^([[:space:]]*tag:).*/\1 ${IMAGE_TAG}/" \
            helm/nodejs-microservices/values-dev.yaml

      - name: Commit updated development values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/nodejs-microservices/values-dev.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update development image tag to ${IMAGE_TAG} [skip ci]"

          git push