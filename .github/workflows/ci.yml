name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install API Gateway dependencies
        working-directory: api-gateway
        run: npm ci

      - name: Install Identity Service dependencies
        working-directory: identity-service
        run: npm ci

      - name: Install Post Service dependencies
        working-directory: post-service
        run: npm ci

      - name: Install Media Service dependencies
        working-directory: media-service
        run: npm ci

      - name: Install Search Service dependencies
        working-directory: search-service
        run: npm ci

      - name: Install E2E test dependencies
        working-directory: tests
        run: npm ci

      - name: Start services
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            up -d --build

      - name: Wait for API Gateway
        run: |
          timeout 120 bash -c '
            until curl -fs http://localhost:3000/api/health; do
              echo "Waiting for API Gateway..."
              sleep 2
            done
          '

      - name: Verify all containers are running
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            ps

          FAILED=$(docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            ps --status exited -q)

          if [ -n "$FAILED" ]; then
            echo "One or more containers exited unexpectedly."
            exit 1
          fi

      - name: Run E2E tests
        working-directory: tests
        run: npm test

      - name: Print Docker logs
        if: failure()
        run: docker compose logs

      - name: Save Docker logs
        if: always()
        run: |
          mkdir -p logs

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            logs > logs/docker-compose.log

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: logs/docker-compose.log

      - name: Shutdown containers
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            down -v