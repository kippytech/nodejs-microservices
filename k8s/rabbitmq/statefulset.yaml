apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: rabbitmq
  namespace: development

spec:
  serviceName: rabbitmq

  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:
        - name: rabbitmq

          image: rabbitmq:3.13-management

          ports:
            - containerPort: 5672

            - containerPort: 15672

          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest

            - name: RABBITMQ_DEFAULT_PASS
              value: guest

          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi

  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi