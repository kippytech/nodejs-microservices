apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb
  namespace: development

spec:
  serviceName: mongodb

  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb

          image: mongo:6

          command:
            - mongod
            - --bind_ip_all
            - --replSet
            - rs0

          ports:
            - containerPort: 27017

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

  volumeClaimTemplates:

    - metadata:
        name: mongodb-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi