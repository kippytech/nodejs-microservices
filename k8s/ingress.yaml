apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: api-gateway
  namespace: development

spec:
  ingressClassName: nginx

  rules:
    - host: api.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: api-gateway

                port:
                  number: 3000