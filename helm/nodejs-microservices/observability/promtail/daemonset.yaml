apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: promtail

spec:

  selector:
    matchLabels:
      app: promtail

  template:

    metadata:
      labels:
        app: promtail

{{ include "nodejs-microservices.labels" . | indent 8 }}

    spec:

      serviceAccountName: promtail

      containers:

        - name: promtail

          image: {{ .Values.promtail.image }}

          imagePullPolicy: {{ .Values.promtail.imagePullPolicy }}

          args:
            - "-config.file=/etc/promtail/config.yml"

          resources:
{{ toYaml .Values.promtail.resources | nindent 12 }}

          volumeMounts:

            - name: config

              mountPath: /etc/promtail

            # - name: varlog

            #   mountPath: /var/log

            #   readOnly: true

            
            - name: pods

              mountPath: /var/log/pods

              readOnly: true

            - name: containers

              mountPath: /var/log/containers #/var/lib/docker/containers

              readOnly: true

      volumes:

        - name: config

          configMap:
            name: promtail-config

        # - name: varlog

        #   hostPath:
        #     path: /var/log

        - name: pods

          hostPath:
            path: /var/log/pods

        - name: containers

          hostPath:
            path: /var/log/containers #/var/lib/docker/containers