apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana

spec:
  replicas: {{ .Values.grafana.replicas }}

  selector:
    matchLabels:
      app: grafana

  template:

    metadata:
      labels:
        app: grafana

{{ include "nodejs-microservices.labels" . | indent 8 }}

    spec:

      containers:

        - name: grafana

          image: {{ .Values.grafana.image }}

          imagePullPolicy: {{ .Values.grafana.imagePullPolicy }}

          ports:
            - containerPort: 3000

          resources:
{{ toYaml .Values.grafana.resources | nindent 12 }}

          volumeMounts:

            - name: grafana-data
              mountPath: /var/lib/grafana

      volumes:

        - name: grafana-data

          persistentVolumeClaim:
            claimName: grafana-data