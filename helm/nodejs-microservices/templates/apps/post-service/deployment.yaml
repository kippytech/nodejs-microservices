apiVersion: apps/v1
kind: Deployment

metadata:
  name: post-service
  #namespace: {{ include "nodejs-microservices.namespace" . }}

spec:
  replicas: {{ .Values.postService.replicas }}

  selector:
    matchLabels:
      app: post-service

  template:
    metadata:
      labels:
        app: post-service

    spec:
      containers:
        - name: post-service

          #image: {{ index .Values.images "post-service" }}
          image: "{{ index .Values.images "post-service" }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.imagePullPolicy.local }}

          envFrom:
            - configMapRef:
                name: {{ .Values.postService.configMap }}

            - secretRef:
                name: {{ .Values.postService.secret }}

          ports:
            - containerPort: 3000

          resources:
          {{- toYaml .Values.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: /api/health
              port: 3000

            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3