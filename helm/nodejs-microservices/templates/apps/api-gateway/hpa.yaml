apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: api-gateway
  #namespace: {{ .Values.namespace }} #development

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway

  minReplicas: {{ .Values.apiGateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.hpa.maxReplicas }}

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: {{ .Values.apiGateway.hpa.averageCpuUtilization }} #70