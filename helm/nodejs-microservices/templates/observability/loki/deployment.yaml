apiVersion: apps/v1
kind: Deployment

metadata:
  name: loki

spec:
  replicas: {{ .Values.loki.replicas }}

  selector:
    matchLabels:
      app: loki

  template:

    metadata:
      labels:
        app: loki

{{ include "nodejs-microservices.labels" . | indent 8 }}

    spec:

      containers:

        - name: loki

          image: {{ .Values.loki.image }}

          imagePullPolicy: {{ .Values.loki.imagePullPolicy }}

          args:
            - "-config.file=/etc/loki/local-config.yaml"

          ports:
            - containerPort: 3100

          resources:
{{ toYaml .Values.loki.resources | nindent 12 }}