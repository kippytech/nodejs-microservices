global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
        
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:3000

  - job_name: "identity-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - identity-service:3000

  - job_name: "post-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - post-service:3000

  - job_name: "media-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - media-service:3000

  - job_name: "search-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - search-service:3000