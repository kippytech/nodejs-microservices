groups:
  - name: service-health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.job }} has not been reachable for more than 1 minute."

  - name: http
    rules:
      - alert: HighHttpLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP latency on {{ $labels.job }}"
          description: "P95 latency is above 1 second."

      - alert: HighHttp5xxRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (job) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx rate on {{ $labels.job }}"
          description: "More than 1 HTTP 5xx response/sec over the last 5 minutes."

  - name: rabbitmq
    rules:
      - alert: RabbitMQConsumerFailures
        expr: |
          sum(rate(rabbitmq_events_failed_total[5m])) by (service) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ consumer failures"
          description: "{{ $labels.service }} is failing to process RabbitMQ events."

  - name: bullmq
    rules:
      - alert: BullMQJobFailures
        expr: |
          sum(rate(bullmq_jobs_failed_total[5m])) by (service) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "BullMQ job failures"
          description: "{{ $labels.service }} has failing BullMQ jobs."

  - name: outbox
    rules:
      - alert: OutboxPublishFailures
        expr: |
          sum(rate(outbox_publish_failures_total[5m])) by (service) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox publish failures"
          description: "{{ $labels.service }} failed to publish Outbox events."