apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nodejs-microservices-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/kippytech/nodejs-microservices.git
    targetRevision: main
    path: helm/nodejs-microservices

    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    syncOptions:
      - CreateNamespace=true